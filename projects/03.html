<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전주효자도서관 — (주)율그룹건축사사무소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --ink: #171613;
    --muted: #726d63;
    --line: #e3ded4;
    --accent: #9c6b3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }
  h1, h2 { font-family: 'Noto Serif KR', serif; font-weight: 600; }
  a { color: inherit; text-decoration: none; }

  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 48px;
    border-bottom: 1px solid var(--line);
  }
  .nav .logo { font-family: 'Noto Serif KR', serif; font-size: 1.1rem; letter-spacing: 0.05em; }
  .back-link { font-size: 0.9rem; color: var(--muted); }

  .project-hero {
    aspect-ratio: 16 / 7;
    background: linear-gradient(135deg, #2f2e28 0%, #5c5b4d 45%, #93917a 100%);
  }

  .project-body { max-width: 900px; margin: 0 auto; padding: 64px 48px 120px; }
  .section-label {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .project-body h1 { font-size: clamp(2.6rem, 5vw, 3.8rem); margin-bottom: 32px; }

  .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.visible { opacity: 1; transform: none; }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 32px 0;
    margin-bottom: 48px;
  }
  .meta-grid dt { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }

  .project-desc { color: var(--muted); max-width: 640px; margin-bottom: 56px; }

  .gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .gallery-item {
    aspect-ratio: 4 / 3;
    border-radius: 4px;
    background: repeating-linear-gradient(45deg, #e3ded4, #e3ded4 10px, #ece8df 10px, #ece8df 20px);
  }

  footer {
    padding: 32px 48px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  @media (max-width: 720px) {
    .nav { padding: 16px 24px; }
    .project-body { padding: 48px 24px 80px; }
    .meta-grid { grid-template-columns: 1fr 1fr; }
    .gallery { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="logo">(주)율그룹건축사사무소</div>
  <a class="back-link" href="../index.html#portfolio">← 포트폴리오로</a>
</header>

<div class="project-hero"></div>

<div class="project-body reveal">
  <div class="section-label">교육시설</div>
  <h1>전주효자도서관</h1>

  <dl class="meta-grid">
    <div>
      <dt>위치</dt>
      <dd>전북 전주</dd>
    </div>
    <div>
      <dt>용도</dt>
      <dd>공공도서관</dd>
    </div>
    <div>
      <dt>규모</dt>
      <dd>[상세 자료 추가 예정]</dd>
    </div>
    <div>
      <dt>수상</dt>
      <dd>2017 전라북도 건축문화상</dd>
    </div>
  </dl>

  <p class="project-desc">2014년 현상공모 당선을 거쳐 완공된 공공도서관으로, 2017년 전라북도 건축문화상을 수상했습니다. [상세 설명 추가 예정]</p>

  <div class="gallery">
    <div class="gallery-item"></div>
    <div class="gallery-item"></div>
    <div class="gallery-item"></div>
    <div class="gallery-item"></div>
  </div>
</div>

<footer>
  &copy; 2026 (주)율그룹건축사사무소. All rights reserved.
</footer>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
</script>

</body>
</html>
