<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 — (주)율그룹건축사사무소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --ink: #171613;
    --muted: #726d63;
    --line: #e3ded4;
    --accent: #9c6b3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: 'Noto Serif KR', serif; font-weight: 600; }
  a { color: inherit; text-decoration: none; }

  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 48px;
    border-bottom: 1px solid var(--line);
  }
  .nav .logo { font-family: 'Noto Serif KR', serif; font-size: 1.1rem; letter-spacing: 0.05em; }
  .nav ul { display: flex; gap: 32px; list-style: none; font-size: 0.9rem; }
  .nav ul a.current { color: var(--accent); }

  .page-header {
    padding: 96px 48px 64px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .page-header .section-label {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .page-header h1 { font-size: clamp(2.2rem, 4vw, 3rem); margin-bottom: 16px; }
  .page-header p { color: var(--muted); max-width: 560px; }

  .section { padding: 0 48px 96px; max-width: 1100px; margin: 0 auto; }

  .work-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: repeat(2, minmax(180px, auto));
    gap: 32px;
  }
  .work-item { display: flex; flex-direction: column; }
  .work-item:first-child { grid-column: 1; grid-row: 1 / span 2; }
  .work-item:nth-child(2) { grid-column: 2; grid-row: 1; }
  .work-item:nth-child(3) { grid-column: 2; grid-row: 2; }
  .work-thumb {
    flex: 1 1 auto;
    min-height: 160px;
    border-radius: 4px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #d8d2c4, #a9967a);
    overflow: hidden;
    transition: transform 0.3s ease;
  }
  .work-item:hover .work-thumb { transform: scale(1.02); }
  .work-category { font-size: 0.8rem; color: var(--accent); margin-bottom: 6px; }
  .work-title { font-size: 1.1rem; font-family: 'Noto Serif KR', serif; }

  footer {
    padding: 32px 48px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  @media (max-width: 720px) {
    .nav { padding: 16px 24px; }
    .nav ul { gap: 16px; font-size: 0.8rem; }
    .page-header { padding: 72px 24px 48px; }
    .section { padding: 0 24px 72px; }
    .work-grid { grid-template-columns: 1fr; grid-template-rows: none; }
    .work-item:first-child, .work-item:nth-child(2), .work-item:nth-child(3) {
      grid-column: auto; grid-row: auto;
    }
    .work-thumb { flex: none; aspect-ratio: 4 / 3; min-height: 0; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="logo">(주)율그룹건축사사무소</div>
  <ul>
    <li><a href="index.html">홈</a></li>
    <li><a href="about.html">소개</a></li>
    <li><a href="portfolio.html" class="current">포트폴리오</a></li>
    <li><a href="history.html">연혁·실적</a></li>
    <li><a href="index.html#contact">연락처</a></li>
  </ul>
</header>

<div class="page-header">
  <div class="section-label">Portfolio</div>
  <h1>작업</h1>
  <p>수상 및 대표 프로젝트를 소개합니다.</p>
</div>

<section class="section">
  <div class="work-grid">
    <a class="work-item" href="projects/01.html">
      <div class="work-thumb"></div>
      <div class="work-category">문화시설</div>
      <div class="work-title">전주 천년 한지관</div>
    </a>
    <a class="work-item" href="projects/02.html">
      <div class="work-thumb"></div>
      <div class="work-category">숙박시설</div>
      <div class="work-title">The May Hotel</div>
    </a>
    <a class="work-item" href="projects/03.html">
      <div class="work-thumb"></div>
      <div class="work-category">교육시설</div>
      <div class="work-title">전주효자도서관</div>
    </a>
  </div>
</section>

<footer>
  &copy; 2026 (주)율그룹건축사사무소. All rights reserved.
</footer>

</body>
</html>
