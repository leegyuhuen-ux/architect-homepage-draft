<title>페이지를 찾을 수 없습니다 — (주)율그룹건축사사무소</title>
<style>
  :root {
    --bg: #faf9f7;
    --ink: #171613;
    --muted: #6a655b;
    --line: #e3ded4;
    --accent: #8a5c33;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'SUIT Variable', sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: 'SUIT Variable', sans-serif; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
  a { color: inherit; text-decoration: none; }

  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 48px;
    border-bottom: 1px solid var(--line);
  }
  .nav .logo { font-family: 'SUIT Variable', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
  .nav ul { display: flex; gap: 32px; list-style: none; font-size: 0.9rem; }
  .nav ul a.current { color: var(--accent); }

  .page-header {
    padding: 96px 48px 64px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .page-header .section-label {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .page-header h1 { font-size: clamp(2.2rem, 4vw, 3rem); margin-bottom: 16px; }
  .page-header p { color: var(--muted); max-width: 560px; }

  .section { padding: 0 48px 96px; max-width: 1100px; margin: 0 auto; }
  .section p.intro { color: var(--muted); max-width: 640px; margin-bottom: 40px; }

  .profile {
    display: flex;
    gap: 24px;
    border-top: 1px solid var(--line);
    padding-top: 32px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }
  .profile dt { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  .profile dd { margin-bottom: 20px; min-width: 200px; }

  .more-link { color: var(--accent); border-bottom: 1px solid var(--accent); }

  .section h2 { font-size: clamp(1.5rem, 3vw, 1.9rem); margin: 64px 0 28px; }
  .section h2:first-of-type { margin-top: 0; }

  .services {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 24px;
  }
  .services li {
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.95rem;
  }

  .groups { color: var(--muted); font-size: 0.92rem; }

  .person-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
  }
  .person-card { border-top: 1px solid var(--line); padding-top: 24px; }
  .person-photo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #d8d2c4, #a9967a);
  }
  .person-card h3 { font-size: 1.3rem; margin-bottom: 4px; }
  .person-role { font-size: 0.85rem; color: var(--accent); margin-bottom: 20px; }
  .person-card dt { font-size: 0.8rem; color: var(--muted); margin-top: 16px; margin-bottom: 4px; }
  .person-card dt:first-of-type { margin-top: 0; }
  .person-card dd { font-size: 0.92rem; }
  .person-card dd ul { padding-left: 18px; margin-top: 2px; }

  footer {
    padding: 40px 48px;
    border-top: 1px solid var(--line);
    font-size: 0.82rem;
    color: var(--muted);
  }
  .footer-inner { max-width: 1100px; margin: 0 auto; }
  .footer-inner strong { color: var(--ink); display: block; margin-bottom: 8px; font-size: 0.92rem; }
  .footer-inner p { margin-bottom: 3px; }
  .footer-copy { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }

  @media (max-width: 720px) {
    .nav { padding: 16px 24px; flex-direction: column; align-items: flex-start; gap: 12px; }
    .nav ul { gap: 10px 16px; font-size: 0.8rem; flex-wrap: wrap; }
    .nav ul a { white-space: nowrap; }
    .page-header { padding: 72px 24px 48px; }
    .section { padding: 0 24px 72px; }
    .services { grid-template-columns: 1fr 1fr; }
    .person-grid { grid-template-columns: 1fr; gap: 32px; }
  }
</style>
